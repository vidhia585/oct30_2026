name: myworkflow1
on:
   push:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
           whoami
           pwd
           cd
           ls -al
           cat /etc/os-release
           docker --version
           docker compose version
      - name: mystep2-clone the repo in current work directory
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al     
      - name: mystep4-we are going to build our own docker image
        run: docker image build -t vidhi/myimage_oct30:t1 -f dockerfile .
      - name: mystep5-check the docker image
        run: docker image ls  
      
